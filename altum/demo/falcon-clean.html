<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فالكون إكسبريس | تتبع الشحنات</title>
<style>
  body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#F3F4F6;color:#1F2937}
  header{background:#1E3A8A;color:#fff;padding:16px 32px;display:flex;align-items:center;gap:12px}
  header b{font-size:22px} header span{opacity:.85}
  main{max-width:460px;margin:40px auto;background:#fff;border-radius:12px;padding:28px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
  h1{font-size:22px;margin:0 0 10px} p{line-height:1.7;color:#4B5563}
  label{display:block;margin:14px 0 6px;font-weight:bold;font-size:14px}
  input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #D1D5DB;border-radius:8px;font-size:15px}
  button{margin-top:20px;width:100%;padding:12px;background:#1E3A8A;color:#fff;border:0;border-radius:8px;font-size:16px;cursor:pointer}
  #out{margin-top:16px;color:#065F46}
  footer{text-align:center;color:#9CA3AF;font-size:12px;margin:24px}
</style>
</head>
<body>
<header><b>فالكون إكسبريس</b><span>Falcon Express</span></header>
<main>
  <h1>تتبع شحنتك</h1>
  <p>أدخل رقم التتبع المكوّن من حروف وأرقام والموجود في رسالة التأكيد.</p>
  <form onsubmit="document.getElementById('out').textContent='الشحنة في الطريق، التوصيل المتوقع غداً.';return false">
    <label for="tr">رقم التتبع</label>
    <input id="tr" name="tracking" type="text" placeholder="FX-00000">
    <button type="submit">تتبع</button>
  </form>
  <p id="out"></p>
</main>
<footer>صفحة تجريبية لعرض «حارس» · «فالكون إكسبريس» علامة وهمية · لا تطلب أي بيانات حساسة</footer>
</body>
</html>
