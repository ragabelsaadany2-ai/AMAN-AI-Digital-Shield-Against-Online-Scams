<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  body{width:330px;margin:0;font-family:Tahoma,Arial,sans-serif;color:#1B2740;background:#F4F6F9}
  .hd{background:#0F1B33;color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}
  .hd img{width:30px;height:30px} .hd b{font-size:17px} .hd small{display:block;color:#E3B04B;font-size:11px}
  .box{background:#fff;margin:10px;border-radius:12px;padding:12px 14px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
  .st{font-weight:bold;font-size:15px;margin-bottom:6px}
  .st.high{color:#B4232A} .st.medium{color:#B7791F} .st.none{color:#1F7A6F}
  ul{margin:6px 0 0;padding-right:18px;font-size:13px;line-height:1.6} li{margin-bottom:3px}
  .muted{color:#6B7689;font-size:12px}
  label{display:block;font-size:12px;margin:8px 0 4px;color:#5A6478}
  input[type=text]{width:100%;box-sizing:border-box;padding:7px;border:1px solid #DCE2EC;border-radius:8px;direction:ltr;font-size:12px}
  .row{display:flex;align-items:center;gap:8px;font-size:13px;margin-top:8px}
  .dot{width:9px;height:9px;border-radius:50%;background:#9AA7BD;display:inline-block}
  .dot.on{background:#3FB68B} .dot.off{background:#E5484D}
</style>
</head>
<body>
  <div class="hd"><img src="icons/icon48.png" alt=""><div><b>حارس</b><small>يسبق الخداع… ويحمي قرارك</small></div></div>
  <div class="box" id="page"><div class="muted">جارٍ التحقق من هذه الصفحة…</div></div>
  <div class="box">
    <div class="row"><span class="dot" id="srvdot"></span><span id="srv">الاتصال بالمخزن المشترك…</span></div>
    <label for="server">عنوان خادم الطُّعم</label>
    <input type="text" id="server">
    <div class="row"><input type="checkbox" id="share"><label for="share" style="margin:0">مشاركة الصفحات المشبوهة مع المخزن المشترك (العنوان والأسباب فقط)</label></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
